apiVersion: v1
kind: ConfigMap
metadata: {name: parity-app, namespace: parity-app}
data:
  app.py: |
    import http.server
    class H(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            b = "".join([
                "# TYPE parity_app_requests_total counter\n",
                'parity_app_requests_total{code="200"} 42\n',
                "# TYPE parity_app_latency_seconds histogram\n",
                'parity_app_latency_seconds_bucket{le="0.1"} 3\n',
                'parity_app_latency_seconds_bucket{le="1"} 7\n',
                'parity_app_latency_seconds_bucket{le="+Inf"} 8\n',
                "parity_app_latency_seconds_sum 2.5\n",
                "parity_app_latency_seconds_count 8\n"]).encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain; version=0.0.4")
            self.end_headers()
            self.wfile.write(b)
        def log_message(self, *a): pass
    http.server.HTTPServer(("", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: parity-app, namespace: parity-app}
spec:
  replicas: 1
  selector: {matchLabels: {app: parity-app}}
  template:
    metadata: {labels: {app: parity-app}}
    spec:
      containers:
        - name: app
          image: python:3-alpine
          imagePullPolicy: IfNotPresent
          command: [python, /app/app.py]
          ports: [{name: metrics, containerPort: 8080}]
          volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: parity-app}}]
---
apiVersion: v1
kind: Service
metadata: {name: parity-app, namespace: parity-app, labels: {app: parity-app}}
spec:
  selector: {app: parity-app}
  ports: [{name: metrics, port: 8080, targetPort: metrics}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: parity-app, namespace: parity-app, labels: {app: parity-app}}
spec:
  selector: {matchLabels: {app: parity-app}}
  endpoints: [{port: metrics, interval: 30s}]
