# Disable default deployments
alertmanager:
  enabled: false

grafana:
  enabled: false

prometheus:
  enabled: true
  agentMode: true
  # IRSA: grants the Prometheus pod ec2:DescribeInstances for the ec2-metadata scrape job below.
  # The IAM policy MUST be Condition-scoped (region and/or ec2:ResourceTag/*) — DescribeInstances
  # ignores Resource ARNs, so an unconditioned policy can enumerate the whole account.
  serviceAccount:
    annotations:
      eks.amazonaws.com/role-arn: <IRSA_ROLE_ARN>  # TODO: replace with the test-cluster role ARN
  prometheusSpec:
    # Enable only necessary scrape configs
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    
    # Configure remote write
    # Global external labels to add to all metrics
    externalLabels:
      cluster: my-cluster-name # Replace with your cluster name

    # EC2 host metadata: discover instances via the AWS API and emit a thin
    # ec2_meta_info{internal_ip, ec2_name, instance_id, instance_type, az} series
    # (one per instance). The dashboard joins it to node-exporter hosts client-side
    # on internal_ip (port-stripped `instance`). See ENG-1308.
    # Scrapes node-exporter (:9102) on each discovered instance, so the synthetic `up`
    # sample is 1 for monitored host nodes (0 for account instances not running it).
    # metric_relabel below keeps ONLY `up` -> renamed to ec2_meta_info, dropping the
    # node_* payload, so nothing leaks. Value is the idiomatic info-metric 1.
    additionalScrapeConfigs:
      - job_name: ec2-metadata
        scrape_interval: 5m
        scrape_timeout: 10s
        ec2_sd_configs:
          - region: <AWS_REGION>   # TODO: replace with the test-cluster region
            port: 9102             # node-exporter port -> up=1 for host nodes
            refresh_interval: 5m
        # NOTE: additionalScrapeConfigs is raw Prometheus config → snake_case
        # (relabel_configs / metric_relabel_configs / source_labels / target_label),
        # unlike remoteWrite.writeRelabelConfigs above which is the operator CRD camelCase form.
        relabel_configs:
          - source_labels: [__meta_ec2_private_ip]
            target_label: internal_ip
          - source_labels: [__meta_ec2_tag_Name]
            target_label: ec2_name
          - source_labels: [__meta_ec2_instance_id]
            target_label: instance_id
          - source_labels: [__meta_ec2_instance_type]
            target_label: instance_type
          - source_labels: [__meta_ec2_availability_zone]
            target_label: az
        metric_relabel_configs:
          - source_labels: [__name__]
            regex: up
            action: keep            # only `up` survives → no node_* from this job
          - source_labels: [__name__]
            regex: up
            target_label: __name__
            replacement: ec2_meta_info
          - source_labels: [ec2_name]
            regex: '(.{1,63}).*'
            target_label: ec2_name
            replacement: '${1}'     # bound Name length (cardinality + sanitization)

    remoteWrite:
      - url: "{{YOUR_MONITORING_ENDPOINT}}"
        remoteTimeout: 60s
        queueConfig:
          capacity: 10000
          maxSamplesPerSend: 3000
          batchSendDeadline: 20s
          minShards: 4
          maxShards: 200
          minBackoff: 100ms
          maxBackoff: 10s
        basicAuth:
          username:
            name: last9-remote-write-secret
            key: username
          password:
            name: last9-remote-write-secret
            key: password
        writeRelabelConfigs:
          - sourceLabels: [__name__]
            regex: "up|kube_.*|container_.*|node_.*|kubelet_volume_stats_.*|ec2_meta_info"  # Keep relevant metrics (+ PVC volume fill from kubelet)  (+ EC2 host metadata)
            action: keep

# Keep kube-state-metrics
kubeStateMetrics:
  enabled: true

# Keep node-exporter
prometheus-node-exporter:
  enabled: true
  service:
    port: 9102
    targetPort: 9102

# Enable cadvisor via kubelet service monitor
kubelet:
  enabled: true
  serviceMonitor:
    resource: true  # Enables scraping of cadvisor metrics
    cAdvisor: true

# Disable unnecessary components
prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false

# Disable other exporters
kubeApiServer:
  enabled: true

kubeControllerManager:
  enabled: false

kubeDns:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

kubeScheduler:
  enabled: false

