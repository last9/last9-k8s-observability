# Disable default deployments
alertmanager:
  enabled: false

grafana:
  enabled: false

prometheus:
  enabled: true
  agentMode: true
  # IRSA: grants the Prometheus pod ec2:DescribeInstances for the ec2-metadata scrape job below.
  # The IAM policy MUST be Condition-scoped (region and/or ec2:ResourceTag/*) — DescribeInstances
  # ignores Resource ARNs, so an unconditioned policy can enumerate the whole account.
  serviceAccount:
    # Pod Identity (recommended) needs NO annotation — leave this empty.
    # IRSA (Path B): uncomment and paste the LITERAL role ARN below.
    # Do NOT use {{ }} here: kube-prometheus-stack runs `tpl` on these annotations, so
    # Go-template braces are evaluated and the chart fails to render. Use a literal ARN.
    annotations: {}
      # eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/<ROLE_NAME>  # IRSA only
  prometheusSpec:
    # Enable only necessary scrape configs
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    scrapeInterval: 60s
    evaluationInterval: 60s
    
    # Configure remote write
    # Global external labels to add to all metrics
    externalLabels:
      cluster: my-cluster-name # Replace with your cluster name

    # EC2 host metadata: discover instances via the AWS API and carry the metadata
    # as labels on the discovery job's `up` series (one per instance) —
    # up{job="ec2-metadata", internal_ip, ec2_name, instance_id, instance_type, az, ...}.
    # The dashboard joins it to node-exporter hosts client-side on internal_ip
    # (port-stripped `instance`); it reads label PRESENCE, never the value. See ENG-1308.
    # __address__ points at a discard port (9): the scrape fails fast (connection
    # refused) so NO node-exporter payload is pulled and there is NO double-scrape.
    # NOTE: there is intentionally NO metric_relabel rename to `ec2_meta_info` — `up` and
    # scrape_* are SYNTHETIC metrics Prometheus appends AFTER metric_relabel_configs, so
    # they cannot be renamed/relabeled there (proof: scrape_samples_post_metric_relabeling).
    # The discard-port scrape yields only `up` (no node_*), and remote-write keeps `up`,
    # so the metadata flows as `up{job="ec2-metadata"}` with no extra processing.
    additionalScrapeConfigs:
      - job_name: ec2-metadata
        scrape_interval: 5m
        scrape_timeout: 10s
        ec2_sd_configs:
          - region: "REPLACE_WITH_AWS_REGION"   # set your region, e.g. us-east-1. NO {{ }}: the chart tpl-renders additionalScrapeConfigs, so Go-template braces fail to parse.
            port: 9                  # discard port: scrape fails fast (up=0); avoids node-exporter double-scrape
            refresh_interval: 5m
            # Discovery is region-wide — DescribeInstances can't be IAM-scoped tighter.
            # Filter to running instances to cut stopped/terminated noise + connection attempts.
            # Scope to only monitored hosts with a tag filter, e.g.:
            #   - name: tag:last9-monitored
            #     values: [ "true" ]
            filters:
              - name: instance-state-name
                values: [ running ]
        # NOTE: additionalScrapeConfigs is raw Prometheus config → snake_case
        # (relabel_configs / metric_relabel_configs / source_labels / target_label),
        # unlike remoteWrite.writeRelabelConfigs above which is the operator CRD camelCase form.
        relabel_configs:
          - source_labels: [__meta_ec2_private_ip]
            target_label: internal_ip
          - source_labels: [__meta_ec2_tag_Name]
            regex: '(.{1,63}).*'
            target_label: ec2_name
            replacement: '${1}'      # bound Name length (cardinality + sanitization)
          - source_labels: [__meta_ec2_instance_id]
            target_label: instance_id
          - source_labels: [__meta_ec2_instance_type]
            target_label: instance_type
          - source_labels: [__meta_ec2_availability_zone]
            target_label: az
          - source_labels: [__meta_ec2_region]
            target_label: region
          - source_labels: [__meta_ec2_architecture]
            target_label: arch
          # AWS tags -> host labels (the dashboard already groups/filters on these).
          # CUSTOMISE: these assume tag keys Environment/Team/Service — adjust to your
          # org's keys/casing (e.g. environment, env). Missing tags -> empty labels.
          - source_labels: [__meta_ec2_tag_Environment]
            target_label: environment
          - source_labels: [__meta_ec2_tag_Team]
            target_label: team
          - source_labels: [__meta_ec2_tag_Service]
            target_label: service
          # ASG name: the aws:autoscaling:groupName tag (key sanitized to underscores
          # in the meta-label). Identifies node fleets — DD's `autoscaling_group`.
          - source_labels: [__meta_ec2_tag_aws_autoscaling_groupName]
            target_label: asg
          - source_labels: [__meta_ec2_instance_lifecycle]
            target_label: lifecycle   # spot / on-demand (empty = on-demand)
          - source_labels: [__meta_ec2_vpc_id]
            target_label: vpc_id
          # subnet_id meta-label can arrive comma-wrapped (",subnet-…,") — extract the id.
          - source_labels: [__meta_ec2_subnet_id]
            regex: ',*([^,]+),*'
            target_label: subnet_id
            replacement: '${1}'

    remoteWrite:
      - url: "{{YOUR_MONITORING_ENDPOINT}}"
        remoteTimeout: 60s
        queueConfig:
          capacity: 10000
          maxSamplesPerSend: 3000
          batchSendDeadline: 20s
          minShards: 4
          maxShards: 200
          minBackoff: 100ms
          maxBackoff: 10s
        basicAuth:
          username:
            name: last9-remote-write-secret
            key: username
          password:
            name: last9-remote-write-secret
            key: password
        writeRelabelConfigs:
          - sourceLabels: [__name__]
            regex: "up|container_.*|kubelet_volume_stats_.*|namedprocess_.*|node_boot_time_seconds|node_context_switches_total|node_cpu_seconds_total|node_disk_io_time_seconds_total|node_disk_read_bytes_total|node_disk_read_time_seconds_total|node_disk_reads_completed_total|node_disk_write_time_seconds_total|node_disk_writes_completed_total|node_disk_written_bytes_total|node_filefd_allocated|node_filesystem_free_bytes|node_filesystem_size_bytes|node_load1|node_load5|node_load15|node_memory_MemAvailable_bytes|node_memory_MemTotal_bytes|node_netstat_Tcp_CurrEstab|node_netstat_Tcp_InSegs|node_netstat_Tcp_OutSegs|node_netstat_Tcp_RetransSegs|node_network_receive_bytes_total|node_network_transmit_bytes_total|node_sockstat_sockets_used|node_sockstat_TCP_alloc|node_sockstat_TCP_tw|node_sockstat_UDP_inuse|node_uname_info|kube_deployment_spec_replicas|kube_deployment_status_replicas_ready|kube_deployment_status_replicas_updated|kube_pod_container_info|kube_pod_container_resource_limits|kube_pod_container_resource_limits_memory_bytes|kube_pod_container_resource_requests|kube_pod_container_resource_requests_memory_bytes|kube_pod_container_status_last_terminated_reason|kube_pod_container_status_restarts_total|kube_pod_container_status_running|kube_pod_container_status_terminated|kube_pod_container_status_terminated_reason|kube_pod_container_status_waiting_reason|kube_pod_created|kube_pod_info|kube_pod_owner|kube_pod_status_phase|kube_state_metrics_total_shards|kube_statefulset_created|kube_statefulset_info|kube_statefulset_replicas|kube_statefulset_spec_replicas|kube_statefulset_status_replicas_available|kube_statefulset_status_replicas_ready|kube_statefulset_status_replicas_unavailable|kube_statefulset_status_replicas_updated"
            action: keep
          - sourceLabels: [__name__]
            regex: "container_(memory_failures_total|blkio_device_usage_total|last_seen|memory_failcnt|sockets|memory_kernel_usage|memory_cache)"
            action: drop

# Keep kube-state-metrics
kubeStateMetrics:
  enabled: true

# Keep node-exporter
prometheus-node-exporter:
  enabled: true
  service:
    port: 9102
    targetPort: 9102

# Enable cadvisor via kubelet service monitor
kubelet:
  enabled: true
  serviceMonitor:
    interval: 60s
    resource: true  # Enables scraping of cadvisor metrics
    cAdvisor: true

# Disable unnecessary components
prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false

# Disable other exporters
kubeApiServer:
  enabled: true

kubeControllerManager:
  enabled: false

kubeDns:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

kubeScheduler:
  enabled: false

