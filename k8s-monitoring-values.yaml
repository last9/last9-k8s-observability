# Disable default deployments
alertmanager:
  enabled: false

grafana:
  enabled: false

# Prometheus is replaced by an OTel Collector + Target Allocator that scrape the
# ServiceMonitors below and remote-write to Last9. Remote write, metric allowlist,
# the ec2-metadata scrape job and the IRSA annotation now live in
# last9-otel-metrics-values.yaml and last9-target-allocator-values.yaml.
prometheus:
  enabled: false

# Keep kube-state-metrics
kubeStateMetrics:
  enabled: true

# Keep node-exporter
prometheus-node-exporter:
  enabled: true
  service:
    port: 9102
    targetPort: 9102

# Enable cadvisor via kubelet service monitor
kubelet:
  # Disabled: the kubelet Service/Endpoints are maintained by the Prometheus Operator, which is off.
  # kubelet/cAdvisor are scraped directly by the Target Allocator (last9-target-allocator-values.yaml).
  enabled: false
  serviceMonitor:
    interval: 60s
    resource: true  # Enables scraping of cadvisor metrics
    cAdvisor: true

# Disable unnecessary components
prometheusOperator:
  enabled: false
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false

# Disable other exporters
kubeApiServer:
  enabled: true

kubeControllerManager:
  enabled: false

kubeDns:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false

kubeScheduler:
  enabled: false

