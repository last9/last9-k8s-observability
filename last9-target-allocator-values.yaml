# Target Allocator for the OTel metrics scraper (replaces the bundled Prometheus).
# Chart: open-telemetry/opentelemetry-target-allocator 0.156.0, release `last9-target-allocator`, namespace `last9`.
# Target Allocator URL (consumed by last9-otel-metrics collector values):
# (chart names the Service <fullname>-ta)
#   http://last9-target-allocator-ta.last9.svc:80
# Discovers all ServiceMonitors/PodMonitors and allocates targets to collector pods
# labelled app.kubernetes.io/instance: last9-otel-metrics.
fullnameOverride: last9-target-allocator

targetAllocator:
  serviceAccount:
    # ec2-metadata discovery (ec2_sd_configs below) now runs in THIS pod, so the IRSA role
    # (ec2:DescribeInstances) must be attached to this ServiceAccount, not to Prometheus.
    # The IAM policy MUST be Condition-scoped (region and/or ec2:ResourceTag/*) — DescribeInstances
    # ignores Resource ARNs, so an unconditioned policy can enumerate the whole account.
    # Pod Identity (recommended) needs NO annotation — leave this empty.
    # IRSA: uncomment and paste the LITERAL role ARN below.
    annotations: {}
      # eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/<ROLE_NAME>  # IRSA only
  config:
    allocation_strategy: consistent-hashing
    collector_selector:
      matchlabels:
        app.kubernetes.io/instance: last9-otel-metrics
    prometheus_cr:
      enabled: true
      scrapeInterval: 60s
      service_monitor_selector: {}
      pod_monitor_selector: {}
    config:
      scrape_configs:
        - job_name: ec2-metadata
          scrape_interval: 5m
          scrape_timeout: 10s
          ec2_sd_configs:
            - region: "REPLACE_WITH_AWS_REGION"   # set your region, e.g. us-east-1. NO {{ }}: the chart tpl-renders additionalScrapeConfigs, so Go-template braces fail to parse.
              port: 9                  # discard port: scrape fails fast (up=0); avoids node-exporter double-scrape
              refresh_interval: 5m
              # Discovery is region-wide — DescribeInstances can't be IAM-scoped tighter.
              # Filter to running instances to cut stopped/terminated noise + connection attempts.
              # Scope to only monitored hosts with a tag filter, e.g.:
              #   - name: tag:last9-monitored
              #     values: [ "true" ]
              filters:
                - name: instance-state-name
                  values: [ running ]
          # NOTE: additionalScrapeConfigs is raw Prometheus config → snake_case
          # (relabel_configs / metric_relabel_configs / source_labels / target_label),
          # unlike remoteWrite.writeRelabelConfigs above which is the operator CRD camelCase form.
          relabel_configs:
            - source_labels: [__meta_ec2_private_ip]
              target_label: internal_ip
            - source_labels: [__meta_ec2_tag_Name]
              regex: '(.{1,63}).*'
              target_label: ec2_name
              replacement: '${1}'      # bound Name length (cardinality + sanitization)
            - source_labels: [__meta_ec2_instance_id]
              target_label: instance_id
            - source_labels: [__meta_ec2_instance_type]
              target_label: instance_type
            - source_labels: [__meta_ec2_availability_zone]
              target_label: az
            - source_labels: [__meta_ec2_region]
              target_label: region
            - source_labels: [__meta_ec2_architecture]
              target_label: arch
            # AWS tags -> host labels (the dashboard already groups/filters on these).
            # CUSTOMISE: these assume tag keys Environment/Team/Service — adjust to your
            # org's keys/casing (e.g. environment, env). Missing tags -> empty labels.
            - source_labels: [__meta_ec2_tag_Environment]
              target_label: environment
            - source_labels: [__meta_ec2_tag_Team]
              target_label: team
            - source_labels: [__meta_ec2_tag_Service]
              target_label: service
            # ASG name: the aws:autoscaling:groupName tag (key sanitized to underscores
            # in the meta-label). Identifies node fleets — DD's `autoscaling_group`.
            - source_labels: [__meta_ec2_tag_aws_autoscaling_groupName]
              target_label: asg
            - source_labels: [__meta_ec2_instance_lifecycle]
              target_label: lifecycle   # spot / on-demand (empty = on-demand)
            - source_labels: [__meta_ec2_vpc_id]
              target_label: vpc_id
            # subnet_id meta-label can arrive comma-wrapped (",subnet-…,") — extract the id.
            - source_labels: [__meta_ec2_subnet_id]
              regex: ',*([^,]+),*'
              target_label: subnet_id
              replacement: '${1}'
